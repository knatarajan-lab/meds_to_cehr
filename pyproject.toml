[build-system]
requires = ["setuptools", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "meds_to_cehr"
dynamic = ["version"]
authors = [
    { name = "Chao Pang", email = "chaopang229@gmail.com" },
    { name = "Xinzhuo Jiang", email = "xj2193@cumc.columbia.edu" },
    { name = "Krishna Kalluri", email = "kk3326@cumc.columbia.edu" },
    { name = "Nishanth Parameshwar Pavinkurve", email = "np2689@cumc.columbia.edu" },
    { name = "Karthik Natarajan", email = "kn2174@cumc.columbia.edu" }
]
description = "Convert MEDS datasets into CEHR-GPT patient sequences"
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.10.0"

classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]

dependencies = [
    "meds==0.3.3",
    "meds_reader==0.1.9",
    "datasets>=2.16.1,<=3.6.0",
    "numpy>=1.24.3",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "python-dateutil",
    "typing_extensions",
]

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "pytest-cov", "black"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
